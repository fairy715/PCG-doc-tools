# PCG 文件工具（jt-doc-tools 離線版）：製作並發布單一安裝檔（手動執行）
# 在乾淨的 Windows 上實際安裝、啟動、自我檢查；全部通過才放到 GitHub Releases
name: 發布安裝包

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "測試通過後發布到 Releases（不勾＝只製作與測試）"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Inno Setup 與安裝畫面的語言檔
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          New-Item -ItemType Directory -Force windows/lang | Out-Null
          foreach ($n in 'ChineseTraditional','Indonesian','Vietnamese') {
            try { Invoke-WebRequest "https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/Unofficial/$n.isl" -OutFile "windows/lang/$n.isl" } catch { Write-Host "略過 $n" }
          }

      - name: 製作安裝內容（原作者程式、Python 與套件、文字辨識模型、OxOffice）
        env:
          GH_TOKEN: ${{ github.token }}
        run: python windows/build.py --out stage

      - name: 打包前自我檢查
        shell: pwsh
        run: |
          & stage\python\python.exe stage\pcg\selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 編譯安裝檔
        shell: pwsh
        run: |
          $up = (Get-Content UPSTREAM | Where-Object { $_ -match '^VERSION=' }) -replace '^VERSION=', ''
          $v = "$up-pcg.$env:GITHUB_RUN_NUMBER"
          "VER=$v" | Out-File -Append $env:GITHUB_ENV
          "UPVER=$up" | Out-File -Append $env:GITHUB_ENV
          $info = @{ version = $v; upstream = $up; commit = $env:GITHUB_SHA.Substring(0, 7) } | ConvertTo-Json -Compress
          [System.IO.File]::WriteAllText("stage/pcg/version.json", $info, (New-Object System.Text.UTF8Encoding($false)))
          $stage = (Resolve-Path stage).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$v" "/DStage=$stage" windows\PCG-DocTools-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Get-ChildItem dist -Filter "PCG-DocTools-Setup-*.exe" | Select-Object -First 1
          Write-Host "$($exe.Name)：$([math]::Round($exe.Length / 1MB)) MB"
          if ($exe.Length -ge 2GB) { throw "安裝檔超過 GitHub Releases 的 2 GB 上限" }

      - name: 實際安裝、啟動並自我檢查
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter "PCG-DocTools-Setup-*.exe" | Select-Object -First 1
          $p = Start-Process $exe.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\PDTtest' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "安裝程式結束代碼 $($p.ExitCode)" }
          & C:\PDTtest\python\python.exe C:\PDTtest\pcg\selftest.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # 用桌面捷徑同一支啟動腳本啟動，確認網頁起得來
          powershell -NoProfile -ExecutionPolicy Bypass -File C:\PDTtest\pcg\launch.ps1 -NoBrowser -NoUpdateCheck
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { $r = Invoke-WebRequest http://127.0.0.1:8765/healthz -UseBasicParsing -TimeoutSec 5; if ($r.StatusCode -eq 200) { $ok = $true; break } } catch { }
            Start-Sleep -Seconds 3
          }
          if (-not $ok) {
            Get-Content C:\PDTtest\data\pcg-logs\server.log -ErrorAction SilentlyContinue | Select-Object -Last 40
            Get-Content C:\PDTtest\data\pcg-logs\server-error.log -ErrorAction SilentlyContinue | Select-Object -Last 60
            throw "網頁沒有起來"
          }
          $page = Invoke-WebRequest http://127.0.0.1:8765/ -UseBasicParsing -TimeoutSec 30
          Write-Host "首頁：HTTP $($page.StatusCode)，$($page.Content.Length) 字元"
          if ($page.StatusCode -ne 200) { throw "首頁打不開" }
          Get-Content C:\PDTtest\data\pcg-logs\server-error.log -ErrorAction SilentlyContinue | Select-Object -Last 15

      - name: 製作小更新包，套用在剛裝好的電腦上測試
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $b = Get-Content stage/pcg/build.json -Raw | ConvertFrom-Json
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q "/DAppVersion=$env:VER" "/DStage=$((Resolve-Path stage).Path)" "/DPatchOnly" `
            "/DDepsSha=$($b.deps_sha256)" "/DPyVer=$($b.python)" "/DRuntimeRev=$($b.runtime_rev)" windows\PCG-DocTools-Setup.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $patch = Get-ChildItem dist -Filter "PCG-DocTools-Update-*.exe" | Select-Object -First 1
          Write-Host "$($patch.Name)：$([math]::Round($patch.Length / 1MB, 1)) MB"

          # 1. 假裝裝的是舊版，套用小更新包 → 版本要變成這一版、自我檢查要過（程式還在跑也要能更新）
          [System.IO.File]::WriteAllText("C:\PDTtest\pcg\version.json", '{"version":"old"}')
          $p = Start-Process $patch.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          Get-Content C:\PDTtest\data\pcg-logs\update.log -Encoding utf8 -ErrorAction SilentlyContinue | Select-Object -Last 8
          if ($p.ExitCode -ne 0) { throw "小更新包結束代碼 $($p.ExitCode)" }
          if (-not (Select-String -Path C:\PDTtest\data\pcg-logs\update.log -Pattern '更新完成' -Encoding utf8 -Quiet)) { throw "小更新包的自我檢查沒有通過" }
          $v = Get-Content C:\PDTtest\pcg\version.json -Raw | ConvertFrom-Json
          if ($v.version -ne $env:VER) { throw "更新後版本是 $($v.version)，應該是 $env:VER" }

          # 2. 執行環境不同（模擬「這次換了套件」）→ 要拒絕、不能動到已安裝的程式
          $bj = Get-Content C:\PDTtest\pcg\build.json -Raw
          [System.IO.File]::WriteAllText("C:\PDTtest\pcg\build.json", $bj.Replace($b.deps_sha256, "0000"))
          [System.IO.File]::WriteAllText("C:\PDTtest\pcg\version.json", '{"version":"old"}')
          $p = Start-Process $patch.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($p.ExitCode -eq 0) { throw "執行環境不同時小更新包應該拒絕安裝" }
          $v = Get-Content C:\PDTtest\pcg\version.json -Raw | ConvertFrom-Json
          if ($v.version -ne "old") { throw "被拒絕的小更新包不應該改動程式" }
          Write-Host "小更新包：正常更新、執行環境不同時拒絕，兩項都通過"

          # 3. 跟上一版比：執行環境一樣，已裝上一版的電腦才能用小更新包
          $prev = gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>$null
          $ok = "unknown"
          if ($prev) {
            New-Item -ItemType Directory -Force prevrel | Out-Null
            gh release download $prev -p build.json -D prevrel 2>$null
            if (Test-Path prevrel/build.json) {
              $pb = Get-Content prevrel/build.json -Raw | ConvertFrom-Json
              $prevRev = if ($pb.runtime_rev) { $pb.runtime_rev } else { 1 }
              $same = ($pb.deps_sha256 -eq $b.deps_sha256) -and ($pb.python -eq $b.python) -and ($prevRev -eq $b.runtime_rev)
              $ok = if ($same) { "yes" } else { "no" }
            }
          }
          $global:LASTEXITCODE = 0
          Write-Host "上一版：$prev；可以用小更新包：$ok"
          "PREV=$prev" | Out-File -Append $env:GITHUB_ENV
          "PATCH_OK=$ok" | Out-File -Append $env:GITHUB_ENV

      - name: 一鍵更新實測（從共用資料夾：找到新版、比對指紋、關掉程式、安裝、自動重新開啟）
        shell: pwsh
        run: |
          Copy-Item stage\pcg\build.json C:\PDTtest\pcg\build.json -Force     # 還原上一步故意改壞的執行環境資訊
          [System.IO.File]::WriteAllText("C:\PDTtest\pcg\version.json", '{"version":"1.0.0-pcg.1"}')
          $patch = Get-ChildItem dist -Filter "PCG-DocTools-Update-*.exe" | Select-Object -First 1
          $share = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\share"
          Copy-Item $patch.FullName $share
          (Get-FileHash $patch.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $patch.Name | Out-File -Encoding ascii "$share\$($patch.Name).sha256"
          $cfg = @{ check = $true; who = "staff"; share = $share.FullName } | ConvertTo-Json
          [System.IO.File]::WriteAllText("C:\PDTtest\data\pcg-update.json", $cfg, (New-Object System.Text.UTF8Encoding($false)))
          $env:PYTHONUTF8 = "1"
          $info = (& C:\PDTtest\python\python.exe C:\PDTtest\pcg\updater.py check | Select-Object -Last 1) | ConvertFrom-Json
          Write-Host ("目前 {0}，最新 {1}（{2}，{3}）" -f $info.current, $info.version, $info.kind, $info.source)
          if (-not $info.available -or $info.version -ne $env:VER -or $info.kind -ne "patch") { throw "沒有找到共用資料夾裡的小更新包" }
          $r = (& C:\PDTtest\python\python.exe C:\PDTtest\pcg\updater.py install | Select-Object -Last 1) | ConvertFrom-Json
          if (-not $r.ok) { throw "按下更新失敗：$($r.error)" }
          $done = $false
          for ($i = 0; $i -lt 80; $i++) {
            Start-Sleep -Seconds 3
            $v = (Get-Content C:\PDTtest\pcg\version.json -Raw -ErrorAction SilentlyContinue | ConvertFrom-Json).version
            $up = $false
            try { $up = (Invoke-WebRequest http://127.0.0.1:8765/healthz -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 } catch { }
            if ($v -eq $env:VER -and $up) { $done = $true; break }
          }
          Get-Content C:\PDTtest\data\pcg-logs\update.log -Encoding utf8 -ErrorAction SilentlyContinue | Select-Object -Last 4
          if (-not $done) { throw "一鍵更新後程式沒有以新版重新開啟" }
          Write-Host "一鍵更新：找到新版、比對指紋、安裝、自我檢查、自動重新開啟，全部完成（$env:VER）"

      - name: 發布到 GitHub Releases
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist -Filter "PCG-DocTools-Setup-*.exe" | Select-Object -First 1
          $patch = Get-ChildItem dist -Filter "PCG-DocTools-Update-*.exe" | Select-Object -First 1
          $ref = (Get-Content UPSTREAM | Where-Object { $_ -match '^REF=' }) -replace '^REF=', ''
          # build.json 也放上發布頁：下一版用它判斷能不能出小更新包
          Copy-Item stage/pcg/build.json build.json
          $files = @($exe.FullName, (Resolve-Path build.json).Path)
          $pmb = [math]::Round($patch.Length / 1MB)
          if ($env:PATCH_OK -eq "no") {
            $line = "這一版換了套件或模型，請用完整安裝檔（直接裝在舊版上面，資料會保留）"
            $lineEn = "This version has new packages or models: use the full installer (install over the old version; data is kept)"
          } else {
            # 小更新包的指紋檔：IT 放到公司共用資料夾時一起放，同仁電腦安裝前會比對
            $sha = "$($patch.FullName).sha256"
            (Get-FileHash $patch.FullName -Algorithm SHA256).Hash.ToLower() + "  " + $patch.Name | Out-File -Encoding ascii $sha
            $files += $patch.FullName
            $files += $sha
            $line = "``$($patch.Name)``（約 $pmb MB）；會自動檢查，如果出現「這次更新包含新的套件或模型」，改用完整安裝檔"
            $lineEn = "``$($patch.Name)`` (about $pmb MB). It checks itself; if it says new components are needed, use the full installer"
          }
          $notes = Get-Content windows/release-notes.md -Raw -Encoding utf8
          $vals = [ordered]@{ '{PATCH_LINE_EN}' = $lineEn; '{PATCH_LINE}' = $line
                              '{VER}' = $env:VER; '{UPVER}' = $env:UPVER; '{FULL_MB}' = "$([math]::Round($exe.Length / 1MB))"
                              '{FULL}' = $exe.Name; '{REF}' = $ref; '{COMMIT}' = $env:GITHUB_SHA.Substring(0, 7) }
          foreach ($k in $vals.Keys) { $notes = $notes.Replace($k, $vals[$k]) }
          [System.IO.File]::WriteAllText("notes.md", $notes, (New-Object System.Text.UTF8Encoding($false)))
          gh release create "v$env:VER" @files --title "PCG 文件工具 $env:VER" --notes-file notes.md --target $env:GITHUB_SHA
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
